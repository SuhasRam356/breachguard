<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webmail Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f5f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .login-box { max-width: 380px; margin: 15vh auto; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h5 class="card-title text-center mb-3">📧 Webmail Login</h5>
      <div th:if="${failed}" class="alert alert-danger small">
        Invalid username or password. Please try again.
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label small">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Sign In</button>
      </form>
      <p class="text-muted text-center small mt-3 mb-0">© 2024 Webmail Services</p>
    </div>
  </div>
</div>
</body>
</html>
