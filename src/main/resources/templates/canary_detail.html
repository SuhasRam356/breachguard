<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head><title>Canary Detail</title></head>
<body>
<section layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 th:text="'🍯 ' + ${canary.label}"></h2>
    <small class="text-muted" th:text="${canary.decoyEmail}"></small>
  </div>
  <div>
    <form th:action="@{/honeypot/{id}/simulate(id=${canary.id})}" method="post" class="d-inline">
      <button class="btn btn-outline-warning btn-sm me-1">🧪 Simulate Attack</button>
    </form>
    <form th:action="@{/honeypot/{id}/delete(id=${canary.id})}" method="post" class="d-inline">
      <button class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this canary?')">🗑 Delete</button>
    </form>
  </div>
</div>

<div class="card p-3 mb-3">
  <strong>Trap URL:</strong>
  <code th:text="${trapUrl}"></code>
  <p class="small text-muted mt-1 mb-0">Share this URL in a leaked credential bundle. When someone visits it, the attack is logged here.</p>
</div>

<h5 class="mt-4">Attack Events (<span th:text="${events.size()}"></span>)</h5>

<div th:if="${events.isEmpty()}" class="text-muted">No events yet. Try the simulate button or wait for a real attack.</div>

<div th:each="e : ${events}" class="card p-3 mb-3" th:classappend="${e.anomaly ? 'border-danger' : ''}">
  <div class="d-flex justify-content-between">
    <div>
      <strong th:text="${e.city} + ', ' + ${e.country}"></strong>
      <span th:if="${e.anomaly}" class="badge bg-danger ms-2">⚠️ Anomaly</span>
      <br><small class="text-muted">IP: <code th:text="${e.ip}"></code></small>
      <br><small class="text-muted" th:text="${e.userAgent}"></small>
    </div>
    <div class="text-end text-muted small">
      <span th:text="${#temporals.format(e.createdAt, 'dd MMM yyyy HH:mm')}"></span>
    </div>
  </div>
  <div th:if="${e.anomaly}" class="mt-2 small text-danger" th:text="${e.anomalyReason}"></div>
</div>

<a th:href="@{/honeypot}" class="btn btn-outline-light mt-3">← Back to canaries</a>
</section>
</body>
</html>
