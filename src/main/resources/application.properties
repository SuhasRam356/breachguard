# BreachGuard — Spring Boot Application Properties

# ── Server ──
server.port=8080

# ── H2 Database (file-based, persisted to disk like SQLite) ──
spring.datasource.url=jdbc:h2:file:./data/breachguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Console (for dev/debugging — visit /h2-console) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Thymeleaf ──
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ── Third-party API keys (optional) ──
breachguard.hibp-api-key=
breachguard.leakcheck-enabled=true
